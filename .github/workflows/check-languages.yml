# Проверка файлов локализации в каждом pull request в master.
# Ошибки (некорректный xml, расхождение языков, пустые значения, дубликаты ключей)
# делают проверку красной; предупреждения только выводятся.
# Файлы не изменяются: кавычки исправляются при публикации.
name: Проверка локализации

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Сборка утилиты
        run: dotnet build ModPlus.LanguageTools.Cli/ModPlus.LanguageTools.Cli.csproj -c Release -o tools

      - name: Проверка файлов локализации
        run: dotnet tools/ModPlus.LanguageTools.Cli.dll check --root LanguageFiles
